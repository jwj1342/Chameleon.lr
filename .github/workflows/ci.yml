name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Repository metadata and docs
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check synchronized versions
        run: python3 scripts/sync_version.py --check
      - name: Check documentation links
        run: python3 scripts/check_docs.py

  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.10"
          - os: ubuntu-24.04
            python-version: "3.12"
          - os: windows-2025
            python-version: "3.12"
          - os: macos-15
            python-version: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e './backend[dev]'
      - name: Run Python tests
        run: python scripts/dev.py test-python
      - name: Check Python style
        run: python scripts/dev.py lint-python

  demo:
    name: MVP demo artifact
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install engine
        run: python -m pip install ./backend
      - name: Generate MVP demo
        run: make demo PYTHON=python
      - name: Upload MVP demo
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mvp-demo
          path: demo/output
          if-no-files-found: error
          retention-days: 14

  lua:
    name: Lua 5.1 and Lightroom SDK mocks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Luacheck
        uses: lunarmodules/luacheck@cc089e3f65acdd1ef8716cc73a3eca24a6b845e4 # v1
        with:
          args: plugin/Chameleon.lrplugin tests/lua
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install --yes lua5.1
      - name: Check Lua 5.1 syntax
        run: make lua-syntax LUAC=luac5.1
      - name: Run Lua tests
        run: make test-lua LUA=lua5.1
