[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chameleon-engine"
version = "0.1.0"
description = "Local adaptive color-transfer engine for the Chameleon.lr Lightroom Classic plugin"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Chameleon.lr contributors" }]
dependencies = [
  "Pillow>=10.0,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10",
  "ruff==0.16.4",
]
release = [
  "pyinstaller==6.22.2",
]

[project.scripts]
chameleon-engine = "chameleon_engine.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
